AWSTemplateFormatVersion: '2010-09-09'
Description: 'Déploiement automatisé du Honeypot sur AWS'

Parameters:
  InstanceType:
    Type: String
    Default: t2.micro
    AllowedValues:
      - t2.micro
      - t2.small
      - t2.medium
      - t3.micro
      - t3.small
    Description: Type d'instance EC2

  KeyPairName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Paire de clés existante pour l'accès SSH

  TelegramBotToken:
    Type: String
    NoEcho: true
    Description: Token Telegram du bot

  TelegramChatId:
    Type: String
    NoEcho: true
    Description: Chat ID Telegram pour les alertes

Resources:
  # Security Group
  HoneypotSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group pour le honeypot
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
          Description: SSH
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: honeypot-sg

  # VPC
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  # Subnet
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']

  # Internet Gateway
  InternetGateway:
    Type: AWS::EC2::InternetGateway

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # Route Table
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable

  # IAM Role pour EC2
  HoneypotIAMRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchAgentServerPolicy
      Tags:
        - Key: Name
          Value: honeypot-role

  HoneypotInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref HoneypotIAMRole

  # EC2 Instance
  HoneypotInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Sub '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2}}'
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref HoneypotSecurityGroup
      IamInstanceProfile: !Ref HoneypotInstanceProfile
      AssociatePublicIpAddress: true

      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -e

          echo "🚀 Initialisation du Honeypot"

          # Mise à jour système
          yum update -y
          yum install -y python3 python3-pip git curl wget nginx

          # Créer l'utilisateur
          useradd -m -s /bin/bash honeypot || true

          # Cloner le repo ou créer les fichiers
          cd /home/honeypot

          # Créer les fichiers de l'application
          cat > honeypot.py << 'HONEYPOT_EOF'
          # Contenu du honeypot.py (voir fichier principal)
          HONEYPOT_EOF

          cat > requirements.txt << 'REQ_EOF'
          Flask==3.0.0
          requests==2.31.0
          gunicorn==21.2.0
          REQ_EOF

          # Setup Python
          python3 -m venv venv
          source venv/bin/activate
          pip install -U pip
          pip install -r requirements.txt

          # Configuration de l'environnement
          cat > .env << 'ENV_EOF'
          TELEGRAM_BOT_TOKEN=${TelegramBotToken}
          TELEGRAM_CHAT_ID=${TelegramChatId}
          FLASK_ENV=production
          ENV_EOF

          chown -R honeypot:honeypot /home/honeypot
          chmod 600 /home/honeypot/.env

          # Service systemd
          cat > /etc/systemd/system/honeypot.service << 'SERVICE_EOF'
          [Unit]
          Description=Web Honeypot
          After=network.target

          [Service]
          Type=simple
          User=honeypot
          WorkingDirectory=/home/honeypot
          EnvironmentFile=/home/honeypot/.env
          ExecStart=/home/honeypot/venv/bin/gunicorn --bind 127.0.0.1:5000 --workers 4 honeypot:app
          Restart=always

          [Install]
          WantedBy=multi-user.target
          SERVICE_EOF

          systemctl daemon-reload
          systemctl enable honeypot
          systemctl start honeypot

          # Configuration Nginx
          systemctl enable nginx
          systemctl start nginx

          echo "✅ Honeypot déployé!"

      Tags:
        - Key: Name
          Value: honeypot-server
        - Key: Project
          Value: security-monitoring

  # Elastic IP
  HoneypotEIP:
    Type: AWS::EC2::EIP
    DependsOn: AttachGateway
    Properties:
      InstanceId: !Ref HoneypotInstance
      Domain: vpc
      Tags:
        - Key: Name
          Value: honeypot-eip

  # CloudWatch Log Group
  HoneypotLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/ec2/honeypot
      RetentionInDays: 30

Outputs:
  InstanceId:
    Description: Instance ID du serveur honeypot
    Value: !Ref HoneypotInstance

  PublicIP:
    Description: Adresse IP publique du honeypot
    Value: !Ref HoneypotEIP

  SSHCommand:
    Description: Commande SSH pour se connecter
    Value: !Sub 'ssh -i your-key.pem ec2-user@${HoneypotEIP}'

  HoneypotURL:
    Description: URL du honeypot
    Value: !Sub 'http://${HoneypotEIP}'

  LogGroupName:
    Description: Nom du groupe CloudWatch Logs
    Value: !Ref HoneypotLogGroup
