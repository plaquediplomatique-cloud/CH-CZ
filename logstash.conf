# Logstash Configuration pour Honeypot

input {
  file {
    path => "/logs/path.txt"
    start_position => "beginning"
    codec => json
    tags => ["honeypot"]
  }
}

filter {
  if "honeypot" in [tags] {

    # Parser le timestamp
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }

    # Extraire les informations d'adresse IP
    geoip {
      source => "ip"
      target => "geoip"
    }

    # Ajouter des tags selon le type de menace
    if [path] =~ /\.env/ {
      mutate { add_tag => [ "env_file", "credential_exposure" ] }
    }

    if [path] =~ /\.git/ {
      mutate { add_tag => [ "git_exposure", "source_code_exposure" ] }
    }

    if [path] =~ /wp-config/ {
      mutate { add_tag => [ "wordpress", "database_config" ] }
    }

    if [path] =~ /admin|administrator|cpanel|phpmyadmin/ {
      mutate { add_tag => [ "admin_panel", "authentication" ] }
    }

    if [path] =~ /shell|webshell|c99/ {
      mutate { add_tag => [ "webshell", "backdoor", "critical" ] }
    }

    if [path] =~ /CVE|exploit/ {
      mutate { add_tag => [ "cve_exploit", "critical" ] }
    }

    if [path] =~ /backup|\.sql|database/ {
      mutate { add_tag => [ "backup", "database" ] }
    }

    if [user_agent] =~ /(?:sqlmap|nikto|nmap|masscan|zap|burp|metasploit)/i {
      mutate { add_tag => [ "scanner", "automated_attack" ] }
    }

    # Normaliser la méthode HTTP
    mutate {
      lowercase => [ "method" ]
    }

    # Ajouter des champs calculés
    mutate {
      add_field => {
        "threat_level" => "medium"
        "event_type" => "honeypot_detection"
      }
    }

    # Augmenter le niveau de menace pour les patterns critiques
    if "critical" in [tags] {
      mutate {
        replace => { "threat_level" => "critical" }
      }
    } else if "credential_exposure" in [tags] or "source_code_exposure" in [tags] {
      mutate {
        replace => { "threat_level" => "high" }
      }
    }
  }
}

output {
  # Envoyer à Elasticsearch
  if "honeypot" in [tags] {
    elasticsearch {
      hosts => ["elasticsearch:9200"]
      index => "honeypot-%{+YYYY.MM.dd}"
    }
  }

  # Debug - afficher dans la console
  stdout {
    codec => json_lines
  }
}
