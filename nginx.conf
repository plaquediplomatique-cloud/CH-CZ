user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy;

    # Rate limiting - Anti-DDoS
    limit_req_zone $binary_remote_addr zone=honeypot:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # Upstream honeypot
    upstream honeypot_app {
        server honeypot:5000;
    }

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # Masquer les headers révélateurs
        server_tokens off;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Server;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;

        # Rate limiting global
        limit_req zone=honeypot burst=200 nodelay;

        # Proxy vers Flask
        location / {
            proxy_pass http://honeypot_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $server_name;

            # Timeouts
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # Pas de redirection
            proxy_redirect off;
        }

        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://honeypot_app;
        }

        # Deny access to sensitive files
        location ~ /\.env {
            deny all;
            access_log /var/log/nginx/blocked.log main;
        }

        # Deny access to .git
        location ~ /\.git {
            deny all;
            access_log /var/log/nginx/blocked.log main;
        }

        # Deny access to admin paths
        location ~ ^/(admin|phpmyadmin|cpanel) {
            access_log /var/log/nginx/blocked.log main;
            proxy_pass http://honeypot_app;
        }
    }

    # HTTPS configuration (décommenter après avoir obtenu les certificats)
    # server {
    #     listen 443 ssl http2 default_server;
    #     listen [::]:443 ssl http2 default_server;
    #     server_name votre-domaine.com;
    #
    #     ssl_certificate /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers HIGH:!aNULL:!MD5;
    #     ssl_prefer_server_ciphers on;
    #
    #     # ... configuration identique à celle du HTTP ...
    # }
    #
    # # Redirection HTTP -> HTTPS
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name votre-domaine.com;
    #     return 301 https://$server_name$request_uri;
    # }
}
